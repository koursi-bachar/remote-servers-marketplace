<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Booking Activated</title>
</head>
<body style="font-family: Arial, sans-serif; color: #222;">

    <h2>Your Machine is Ready</h2>

    <p>Hello {{ user.full_name or user.email }},</p>

    <p>Your booked machine is now <strong>active</strong> and ready for use.</p>

    <h3>Activation Details</h3>
    <table cellpadding="6" style="border-collapse: collapse;">
        <tr>
            <td><strong>Booking ID:</strong></td>
            <td>{{ booking.id }}</td>
        </tr>
        <tr>
            <td><strong>Start Time:</strong></td>
            <td>{{ booking.start_time }}</td>
        </tr>
    </table>

    <p>Enjoy your compute session!</p>

</body>
</html>
