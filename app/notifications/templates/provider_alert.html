<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Provider Alert</title>
</head>
<body style="font-family: Arial, sans-serif; color: #222;">

    <h2>Provider Alert</h2>

    <p>Hello {{ provider.full_name or provider.email }},</p>

    <p>The following alert requires your attention:</p>

    <blockquote style="border-left: 4px solid #999; margin-left: 0; padding-left: 10px;">
        {{ message }}
    </blockquote>

    <p>Please log in to your dashboard for more details.</p>

</body>
</html>
