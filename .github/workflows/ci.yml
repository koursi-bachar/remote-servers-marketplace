name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        ports: ['5432:5432']
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}

    env:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

    steps:
      - name: Fail fast if required secrets are missing
        run: |
          req=(TEST_DATABASE_URL POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB)
          for k in "${req[@]}"; do
            if [ -z "${!k}" ]; then
              echo "::error::Missing required secret: $k"
              exit 1
            fi
          done
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -U "${{ secrets.POSTGRES_USER }}"; do
            echo "Waiting for database..."; sleep 3;
          done

      - name: Run migrations
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: alembic upgrade head

      - name: Run tests with coverage
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: pytest

      - name: Enforce coverage ≥ 80%
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cov = float(ET.parse('coverage.xml').getroot().attrib['line-rate'])
          if cov < 0.80:
              raise SystemExit(f"Coverage {cov:.1%} below 80%")
          print(f"Coverage OK ({cov:.1%})")
          PY

      - name: Upload coverage.xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml