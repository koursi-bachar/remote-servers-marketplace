<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <title>SuperVision - High-Performance GPU Compute</title>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Load Tailwind from CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    animation: {
                        'marquee-right': 'marquee-right 30s linear infinite',
                        'marquee-left': 'marquee-left 30s linear infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        'marquee-right': {
                            '0%': { transform: 'translateX(0%)' },
                            '100%': { transform: 'translateX(-50%)' }
                        },
                        'marquee-left': {
                            '0%': { transform: 'translateX(-50%)' },
                            '100%': { transform: 'translateX(0%)' }
                        },
                        'float': {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' }
                        }
                    },
                    backgroundImage: {
                        'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
                        'gradient-gpu': 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                    }
                }
            }
        };
    </script>
    
    <!-- Particles.js for background -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    
    <!-- Inline critical CSS for homepage -->
    <style>
        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }
        
        /* Custom utility classes */
        .text-gradient-gpu {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .nav-bg {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(16px) saturate(180%);
        }
        
        .dark .nav-bg {
            background: rgba(1, 2, 5, 0.8);
        }
        
        .v-line {
            width: 1px;
            background-color: rgb(229 231 235);
        }
        
        .dark .v-line {
            background-color: rgba(255, 255, 255, 0.05);
        }
        
        .animate-intro {
            animation: intro 0.6s ease-out forwards;
        }
        
        @keyframes intro {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Hide fallback initially */
        #fallback-content {
            display: none;
        }
        
        /* Ensure dark mode is applied */
        .dark {
            color-scheme: dark;
        }
    </style>
</head>
<body class="bg-white dark:bg-[#010205] text-gray-900 dark:text-gray-100">
    <!-- React will mount here -->
    <div id="react-homepage-root"></div>
    
    <!-- Fallback content if React doesn't load -->
    <div id="fallback-content">
        <div class="min-h-screen flex items-center justify-center bg-[#010205] text-white p-8">
            <div class="text-center max-w-2xl">
                <h1 class="text-4xl md:text-5xl font-bold mb-6 bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">
                    SuperVision Remote Servers
                </h1>
                <p class="text-xl text-gray-300 mb-8">
                    High-performance GPU servers on demand. Rent, scale, and pay only for what you use.
                </p>
                <div class="flex flex-col sm:flex-row gap-4 justify-center">
                    <a href="/listings" class="bg-gradient-to-r from-blue-600 to-emerald-600 text-white px-8 py-3 rounded-full font-semibold hover:opacity-90 transition-opacity">
                        Browse Listings
                    </a>
                    <a href="/login" class="border border-gray-700 text-white px-8 py-3 rounded-full font-medium hover:bg-white/5 transition-colors">
                        Log In
                    </a>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Load React bundle - fix the path based on your build output -->
    <script type="module" src="/static/react/assets/index.js"></script>
    
    <script>
        // Show fallback if React doesn't load within 3 seconds
        setTimeout(() => {
            const reactRoot = document.getElementById('react-homepage-root');
            if (!reactRoot || reactRoot.children.length === 0) {
                document.getElementById('fallback-content').style.display = 'block';
            }
        }, 3000);
        
        // Initialize particles.js
        window.addEventListener('DOMContentLoaded', function() {
            // Create particles container
            const particlesContainer = document.createElement('div');
            particlesContainer.id = 'particles-js';
            particlesContainer.className = 'fixed inset-0 z-0';
            particlesContainer.innerHTML = '<canvas class="particles-js-canvas-el" style="width: 100%; height: 100%;"></canvas>';
            document.body.appendChild(particlesContainer);
            
            // Initialize particles
            if (window.particlesJS) {
                particlesJS('particles-js', {
                    particles: {
                        number: { value: 80, density: { enable: true, value_area: 800 } },
                        color: { value: "#3b82f6" },
                        shape: { type: "circle" },
                        opacity: { value: 0.5, random: false },
                        size: { value: 3, random: true },
                        line_linked: {
                            enable: true,
                            distance: 150,
                            color: "#3b82f6",
                            opacity: 0.4,
                            width: 1
                        },
                        move: {
                            enable: true,
                            speed: 2,
                            direction: "none",
                            random: false,
                            straight: false,
                            out_mode: "out",
                            bounce: false
                        }
                    },
                    interactivity: {
                        detect_on: "canvas",
                        events: {
                            onhover: { enable: true, mode: "repulse" },
                            onclick: { enable: true, mode: "push" }
                        }
                    },
                    retina_detect: true
                });
            }
        });
    </script>
</body>
</html>
