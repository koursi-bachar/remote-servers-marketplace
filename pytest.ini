[pytest]
addopts =
    --cov=app
    --cov-report=term-missing
    --cov-report=xml
    -q
    -ra
    --maxfail=1
    --disable-warnings
filterwarnings =
    error::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
markers =
    integration: marks integration tests
pythonpath = .
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function